<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Lab Komputer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-zinc-900 dark:text-zinc-200 min-h-screen font-sans">

    <header class="bg-white dark:bg-zinc-800 border-b border-gray-200 dark:border-zinc-700 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-lg font-bold text-gray-800 dark:text-zinc-100">Monitoring Lab Komputer</h1>
            </div>

            <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="flex items-center bg-gray-100 dark:bg-zinc-900 p-1 rounded border border-gray-200 dark:border-zinc-700">
                    <button onclick="setFilter('ALL')" id="filter-ALL" class="px-2.5 py-1 rounded bg-blue-600 text-white font-medium">
                        Semua (<span id="count-total">0</span>)
                    </button>
                    <button onclick="setFilter('Online')" id="filter-Online" class="px-2.5 py-1 rounded text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white">
                        Online (<span id="count-online">0</span>)
                    </button>
                    <button onclick="setFilter('Warning')" id="filter-Warning" class="px-2.5 py-1 rounded text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white">
                        Warning (<span id="count-warning">0</span>)
                    </button>
                    <button onclick="setFilter('Offline')" id="filter-Offline" class="px-2.5 py-1 rounded text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white">
                        Offline (<span id="count-offline">0</span>)
                    </button>
                </div>

                <input
                    type="text"
                    id="search-input"
                    oninput="renderCards()"
                    placeholder="Cari hostname / IP..."
                    class="bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-700 rounded px-2.5 py-1.5 text-gray-800 dark:text-zinc-200 focus:outline-none focus:border-blue-500 w-44"
                >

                <button
                    onclick="toggleTheme()"
                    id="theme-btn"
                    class="bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-700 px-3 py-1.5 rounded text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-700"
                >
                    Mode: <span id="theme-text" class="font-semibold">Gelap</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-5">
        <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
        </div>

        <div id="empty-state" class="hidden bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded p-8 text-center text-sm text-gray-500 dark:text-zinc-400">
            Belum ada data komputer yang masuk.
        </div>
    </main>

    <script>
        let allComputers = [];
        let activeFilter = 'ALL';

        function initTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            applyTheme(saved);
        }

        function applyTheme(theme) {
            const html = document.documentElement;
            const text = document.getElementById('theme-text');
            if (theme === 'dark') {
                html.classList.add('dark');
                text.innerText = 'Terang';
            } else {
                html.classList.remove('dark');
                text.innerText = 'Gelap';
            }
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
        }

        function setFilter(filter) {
            activeFilter = filter;
            ['ALL', 'Online', 'Warning', 'Offline'].forEach(k => {
                const btn = document.getElementById('filter-' + k);
                if (k === activeFilter) {
                    btn.className = "px-2.5 py-1 rounded bg-blue-600 text-white font-medium";
                } else {
                    btn.className = "px-2.5 py-1 rounded text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white";
                }
            });
            renderCards();
        }

        function getPeripheralItem(label, ok) {
            if (ok) {
                return `
                    <div class="flex items-center justify-between px-2 py-1 rounded bg-gray-50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 text-[11px]">
                        <span class="text-gray-600 dark:text-zinc-300">${label}</span>
                        <span class="w-2 h-2 rounded-full bg-green-500"></span>
                    </div>
                `;
            }
            return `
                <div class="flex items-center justify-between px-2 py-1 rounded bg-red-50 dark:bg-red-950/40 border border-red-300 dark:border-red-800 text-[11px] font-semibold text-red-700 dark:text-red-300">
                    <span>${label}</span>
                    <span class="text-[10px]">Off</span>
                </div>
            `;
        }

        function getUsbHtml(devices, drives) {
            const list = [...(devices || []), ...(drives || [])];
            if (list.length === 0) {
                return `<span class="text-[11px] text-gray-400 dark:text-zinc-500">-</span>`;
            }
            return list.map(item => `
                <div class="text-[11px] text-gray-700 dark:text-zinc-300 bg-gray-100 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded px-1.5 py-0.5 truncate" title="${item}">
                    ${item}
                </div>
            `).join('');
        }

        function getBar(label, val) {
            const pct = Number(val) || 0;
            let color = pct > 90 ? 'bg-red-500' : (pct > 70 ? 'bg-yellow-500' : 'bg-blue-500');
            return `
                <div>
                    <div class="flex justify-between text-[11px] text-gray-500 dark:text-zinc-400 mb-0.5">
                        <span>${label}</span>
                        <span>${pct}%</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-zinc-700 rounded h-1.5">
                        <div class="${color} h-1.5 rounded" style="width: ${Math.min(pct, 100)}%"></div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
            const container = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');

            let online = 0, warning = 0, offline = 0;
            allComputers.forEach(pc => {
                if (pc.status === 'Online') online++;
                else if (pc.status === 'Warning') warning++;
                else offline++;
            });

            document.getElementById('count-total').innerText = allComputers.length;
            document.getElementById('count-online').innerText = online;
            document.getElementById('count-warning').innerText = warning;
            document.getElementById('count-offline').innerText = offline;

            const filtered = allComputers.filter(pc => {
                if (activeFilter !== 'ALL' && pc.status !== activeFilter) return false;
                if (!q) return true;
                const text = `${pc.hostname || ''} ${pc.local_ip || ''} ${pc.active_user || ''} ${(pc.connected_devices || []).join(' ')}`.toLowerCase();
                return text.includes(q);
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            let html = '';
            filtered.forEach((pc, i) => {
                const p = pc.peripherals || {};
                let statusColor = 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300';
                let monitorColor = 'border-green-500 text-green-600 dark:text-green-400';

                if (pc.status === 'Warning') {
                    statusColor = 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/40 dark:text-yellow-300';
                    monitorColor = 'border-yellow-500 text-yellow-600 dark:text-yellow-400';
                } else if (pc.status === 'Offline') {
                    statusColor = 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300';
                    monitorColor = 'border-gray-400 text-gray-400 dark:border-zinc-600 dark:text-zinc-500';
                }

                const netText = pc.is_online
                    ? `<span class="text-green-600 dark:text-green-400 font-medium">Terhubung</span>`
                    : `<span class="text-red-600 dark:text-red-400 font-semibold">Putus</span>`;

                html += `
                    <div class="bg-white dark:bg-zinc-800 rounded-lg border border-gray-200 dark:border-zinc-700 shadow-sm p-3 flex flex-col justify-between">
                        <div>
                            <!-- Header PC -->
                            <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-gray-100 dark:border-zinc-700">
                                <div class="flex items-center gap-2.5 min-w-0">
                                    <div class=" flex flex-col items-center shrink-0">
                                        <div class="w-9 h-6 rounded border-2 ${monitorColor} flex items-center justify-center text-[10px] font-bold">
                                            ${String(i + 1).padStart(2, '0')}
                                        </div>
                                        <div class="w-3 h-0.5 bg-gray-400 dark:bg-zinc-500 mt-0.5"></div>
                                    </div>
                                    <div class="min-w-0">
                                        <div class="text-xs font-bold text-gray-900 dark:text-zinc-100 truncate">${pc.hostname || 'Unknown'}</div>
                                        <div class="text-[11px] text-gray-500 dark:text-zinc-400">${pc.local_ip || '-'}</div>
                                    </div>
                                </div>
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded ${statusColor}">
                                    ${pc.status}
                                </span>
                            </div>

                            <!-- Info Dasar -->
                            <div class="py-2 border-b border-gray-100 dark:border-zinc-700 text-[11px] space-y-1">
                                <div class="flex justify-between">
                                    <span class="text-gray-500 dark:text-zinc-400">User / Uptime</span>
                                    <span class="font-medium text-gray-800 dark:text-zinc-200">${pc.active_user || '-'} (${pc.uptime || '-'})</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-500 dark:text-zinc-400">Internet</span>
                                    ${netText}
                                </div>
                            </div>

                            <!-- Periferal -->
                            <div class="py-2 border-b border-gray-100 dark:border-zinc-700">
                                <div class="grid grid-cols-2 gap-1.5">
                                    ${getPeripheralItem('Mouse', p.mouse)}
                                    ${getPeripheralItem('Keyboard', p.keyboard)}
                                    ${getPeripheralItem('Audio', p.audio)}
                                    ${getPeripheralItem('Monitor', p.monitor)}
                                </div>
                            </div>

                            <!-- Perangkat USB -->
                            <div class="py-2 border-b border-gray-100 dark:border-zinc-700">
                                <div class="text-[10px] text-gray-400 dark:text-zinc-400 mb-1">Perangkat USB:</div>
                                <div class="space-y-1">
                                    ${getUsbHtml(pc.connected_devices, pc.usb_drives)}
                                </div>
                            </div>

                            <!-- Resource -->
                            <div class="pt-2 space-y-1.5">
                                <div class="grid grid-cols-2 gap-2">
                                    ${getBar('CPU', pc.cpu_percent)}
                                    ${getBar('RAM', pc.ram_percent)}
                                </div>
                                <div class="flex justify-between text-[11px] text-gray-500 dark:text-zinc-400 pt-1">
                                    <span>Disk: ${pc.storage_free_gb || 0} GB</span>
                                    <span class="truncate max-w-[110px]" title="${pc.top_process || '-'}">${pc.top_process || '-'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="mt-2 pt-2 border-t border-gray-100 dark:border-zinc-700 space-y-1.5">
                            <div class="grid grid-cols-2 gap-1.5">
                                <button
                                    onclick="sendCommand('${pc.mac_address || ''}', '${pc.hostname || 'PC'}', 'restart')"
                                    ${pc.status === 'Offline' ? 'disabled' : ''}
                                    class="px-2 py-1 text-[11px] font-medium rounded border border-gray-300 dark:border-zinc-600 text-gray-700 dark:text-zinc-200 hover:bg-gray-100 dark:hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed"
                                >
                                    Restart
                                </button>
                                <button
                                    onclick="sendCommand('${pc.mac_address || ''}', '${pc.hostname || 'PC'}', 'shutdown')"
                                    ${pc.status === 'Offline' ? 'disabled' : ''}
                                    class="px-2 py-1 text-[11px] font-medium rounded bg-red-600 hover:bg-red-700 text-white disabled:opacity-40 disabled:cursor-not-allowed"
                                >
                                    Shutdown
                                </button>
                            </div>
                            ${pc.pending_command ? `<div class="text-[10px] text-center text-amber-600 dark:text-amber-400 font-medium">Menunggu ${pc.pending_command}...</div>` : ''}
                            <div class="flex justify-between text-[10px] text-gray-400 dark:text-zinc-500">
                                <span>${pc.mac_address || '-'}</span>
                                <span>${(pc.last_seen || '').split(' ')[1] || '-'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function sendCommand(mac, hostname, command) {
            if (!mac) return;
            const label = command === 'shutdown' ? 'mematikan (Shutdown)' : 'me-restart';
            if (!confirm(`Yakin ingin ${label} komputer "${hostname}"?`)) {
                return;
            }
            try {
                await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mac_address: mac, command: command })
                });
                fetchData();
            } catch (error) {
                alert('Gagal mengirim perintah ke server.');
            }
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/monitoring');
                allComputers = await response.json();
                renderCards();
            } catch (error) {
                console.error('Gagal mengambil data:', error);
            }
        }

        initTheme();
        fetchData();
        setInterval(fetchData, 2000);
    </script>
</body>
</html>
